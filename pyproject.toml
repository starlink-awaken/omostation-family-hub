[project]
name = "family-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "starlink-awaken", email = "234556587+starlink-awaken@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = [
    "uv_build>=0.11.19,<0.12.0",
]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "S",
    "PLE",
    "RUF100",
]
ignore = [
    "S101",
    "S603",
    "S607",
    "S108",
    "S110",
    "S310",
    "S314",
    "S608",
    "E402",
    "E501",
    "SIM115",
    "N813",
    "UP047",
    "F401",
]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.0",
]
