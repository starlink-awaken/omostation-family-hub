services:
  app:
    build:
      context: .
      dockerfile: _deploy/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - FAMILY_SSOT_ROOT=/ssot
      - FAMILY_DASHBOARD_PASSWORD=${FAMILY_DASHBOARD_PASSWORD}
      - FAMILY_DASHBOARD_COOKIE_TTL_DAYS=7
      - FAMILY_AI_GATEWAY=http://ai-gateway:4000
      - FAMILY_AI_REDACT_CONTEXT=true
      - FAMILY_CRON_TOKEN=${FAMILY_CRON_TOKEN}
      - BARK_API_KEY=${BARK_API_KEY}
    volumes:
      - "${FAMILY_SSOT_ROOT}:/ssot:rw"
      - app-data:/app/app-data
    restart: unless-stopped

  ai-gateway:
    profiles: ["ai"]
    image: ghcr.io/nicepkg/omlx:v0.1.19
    ports:
      - "4000:4000"
    volumes:
      - ai-models:/app/models
    environment:
      - OMLX_PORT=4000
    restart: unless-stopped

volumes:
  app-data:
  ai-models:
